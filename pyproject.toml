[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["skwwnl <skwwnl@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.12.7"
tortoise-orm = "0.21.6"
fastapi = {extras = ["standard"], version = "0.115.2"}
uvicorn = "0.31.1"
python-jose = "3.3.0"
aerich = "0.7.2"
aiomysql = "0.2.0"
python-dotenv = "1.0.1"
pydantic = "2.9.2"
pydantic-settings = "2.5.2"
gunicorn = "23.0.0"
fastapi-utils = "^0.7.0"
apscheduler = "^3.10.4"
aiohttp = "^3.10.10"

[tool.black]
line-length = 150

[tool.isort]
profile = "black"

[tool.aerich]
tortoise_orm = "src.core.configs.database_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

# TMDB 모델 tortoise_orm 경로 (필요할때만 사용 현재 DB에 모델 적용되어있음)
#[tool.aerich]
#tortoise_orm = "movie_api.config.TORTOISE_ORM"
#location = "./migrations"
#src_folder = "./."

#### 사용 예제 #####
# 첫 번째 ORM 설정에 대해 마이그레이션 실행
#aerich init -t movie_api.config.TORTOISE_ORM
#aerich migrate --name initial_migration
#aerich upgrade

# 두 번째 ORM 설정에 대해 마이그레이션 실행
#aerich init -t src.core.configs.database_config.TORTOISE_ORM
#aerich migrate --name initial_migration
#aerich upgrade

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
black = "24.10.0"
flake8 = "7.1.1"
mypy = "1.11.2"
isort = "5.13.2"
pytest-cov = "5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
